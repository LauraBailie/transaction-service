server:
  port: 8080

spring:
  application:
    name: TransactionServiceApplication
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update  # Auto-create/update tables
    show-sql: true
  h2:
    console:
      enabled: true
springdoc:
  # api-docs:
  #   path: /api-docs
  swagger-ui:
    path: /swagger-ui.html   # Interactive UI at http://localhost:8080/swagger-ui.html
    operationsSorter: method # Sort endpoints by HTTP method (GET first, etc.)
    tagsSorter: alpha        # Sort tags alphabetically
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
jwt:
  secret: 25a1b75736c6d789135f8c59b08726fa  # HS256 key
  expiration: 900000  # 15 minutes in ms (short for security)
