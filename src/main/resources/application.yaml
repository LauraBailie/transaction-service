server:
  port: ${PORT:8080}

spring:
  application:
    name: TransactionServiceApplication
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update  # Auto-create/update tables
    show-sql: true
  h2:
    console:
      enabled: true
springdoc:
  # api-docs:
  #   path: /api-docs
  swagger-ui:
    path: /swagger-ui.html   # Interactive UI at http://localhost:8080/swagger-ui.html
    operationsSorter: method # Sort endpoints by HTTP method (GET first, etc.)
    tagsSorter: alpha        # Sort tags alphabetically
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
jwt:
  secret: super-secret-local-test-key-do-not-use-in-production-abcdefghijklmnopqrstuvwxyz123456
  expiration: 86400000