spring:
  datasource:
    url: ${DB_URL}                # set in env var on Render
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-description: "Baseline for prod DB"
    locations: classpath:db/migration,classpath:db/migration/postgresql  # extra safety
    validate-on-migrate: false  # skip validation if baseline needed
    out-of-order: true  # allow out-of-order if needed for testing
    clean-disabled: false  # allow clean if desperate

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect  # explicit dialect

logging:
  level:
    org.flywaydb: DEBUG
    org.flywaydb.core: DEBUG
    org.springframework.boot.autoconfigure.flyway: TRACE  # ultra-verbose auto-config
    org.springframework.jdbc: DEBUG