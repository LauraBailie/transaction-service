spring:
  datasource:
    url: ${DB_URL}                # set in env var on Render
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none  # Important: Flyway handles schema
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: false
logging:
  level:
    org.flywaydb: DEBUG     # This will show why Flyway skips
    org.springframework.boot.autoconfigure.flyway: DEBUG